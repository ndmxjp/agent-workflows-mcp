name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC); no NPM_TOKEN secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      # Refuse to publish a version that doesn't match the tag
      - run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json version $PKG"; exit 1
          fi
      # prepublishOnly runs bun run build && bun test
      - run: npm publish
